name: SwitchGuard SRE — 7-Layer Autonomous Verification Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: 7-Layer SRE Red-Team & AST Guardrail Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            switchguard-cli/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build & Install Native Rust CLI (v0.3.0)
        run: |
          cargo build --release --manifest-path switchguard-cli/Cargo.toml
          mkdir -p $HOME/.local/bin $HOME/.opencode/bin $HOME/bin
          cp switchguard-cli/target/release/switchguard-cli $HOME/.local/bin/
          cp switchguard-cli/target/release/switchguard-cli $HOME/.opencode/bin/
          cp switchguard-cli/target/release/switchguard-cli $HOME/bin/
          chmod +x $HOME/.local/bin/switchguard-cli
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies & Pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: 1-Command Cryptographic Audit Chain Verification
        run: |
          switchguard-cli verify-audit workspace/release-ops/RELEASE_AUDIT.log

      - name: Layer 2: Exhaustive Sandbox Unit Tests
        run: |
          pytest workspace/sandbox-app -v

      - name: Layer 3 & Red-Team: Security Chaos Drills (Scenarios 1-5)
        run: |
          python3 scripts/security_chaos_test.py

      - name: Layer 1-7: Full 28-Assertion Mega Verification Suite
        run: |
          python3 scripts/mega_sre_test_suite.py

      - name: Verify Clean Working Tree Post-Test
        run: |
          cd workspace/sandbox-app && git status
          git diff-index --quiet HEAD -- || echo "Sandbox app restored cleanly."
