name: CI

on:
  push:
    branches: [main, hardening/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: SwitchGuard SRE Hardened Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Install Dependencies (Pinned)
        run: |
          python -m pip install --upgrade pip==24.3.1
          pip install pytest==8.3.3 pyyaml==6.0.2

      - name: Run Rust Unit Tests
        run: |
          cargo test --manifest-path switchguard-cli/Cargo.toml

      - name: Build and Install switchguard-cli (Release)
        run: |
          cargo build --release -j 2 --manifest-path switchguard-cli/Cargo.toml
          mkdir -p $HOME/.local/bin $HOME/.opencode/bin $HOME/bin
          cp switchguard-cli/target/release/switchguard-cli $HOME/.local/bin/switchguard-cli
          cp switchguard-cli/target/release/switchguard-cli $HOME/.opencode/bin/switchguard-cli
          cp switchguard-cli/target/release/switchguard-cli $HOME/bin/switchguard-cli
          chmod 555 $HOME/.local/bin/switchguard-cli
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          sha256sum $HOME/.local/bin/switchguard-cli | awk '{print $1}' > TRUSTED_BINARY_SHA256

      - name: Run 7-Layer Mega SRE Test Suite (54 Assertions)
        run: |
          python3 scripts/mega_sre_test_suite.py

      - name: Run Empirical 24-Case Replay Evaluation
        run: |
          python3 eval/run_eval.py --backend replay
