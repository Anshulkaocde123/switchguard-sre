[package]
name = "switchguard-cli"
version = "0.4.0"
edition = "2021"
description = "Out-of-Band Rust HMAC Telemetry Scrubber, 10-Rule AST Security Gate, and Hash-Chain Verifier"

[dependencies]
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
